services:
  # ============================================
  # BASE DE DATOS POSTGRESQL
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: delphos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurum_dao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurum_network

  # ============================================
  # API FASTAPI
  # ============================================
  web:
    build: .
    container_name: delphos_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
      # Catálogo del oráculo (solo lectura) — lo consume /api/v1/oracle.
      # Fuera de /code a propósito: anidarlo dentro del bind `.:/code` no es fiable.
      - ../oracle/recommendation/data/processed:/opt/oracle_data:ro
      # inference.py + checkpoints/ — lo que necesita el motor Wide&Deep.
      # Incluye data/processed, así que el featurizador resuelve sus artefactos
      # solo; el montaje de arriba se mantiene porque oracle_catalog usa su
      # propia variable y no tiene por qué saber del modelo.
      - ../oracle/recommendation:/opt/oracle:ro
    ports:
      - "8000:8000"
    environment:
      ORACLE_DATA_DIR: /opt/oracle_data
      ORACLE_MODEL_DIR: /opt/oracle
      # auto = intenta el Wide&Deep y cae al heurístico ante cualquier problema.
      # heuristic = kill switch, ni siquiera importa MindSpore.
      # widedeep = exige el modelo (tests/diagnóstico), no enmascara errores.
      ORACLE_ENGINE: auto
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aurum_dao
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aurum_network

  # ============================================
  # PGADMIN (OPCIONAL - INTERFACE WEB PARA DB)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aurum_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aurum.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - aurum_network
    profiles:
      - tools

networks:
  aurum_network:
    driver: bridge

volumes:
  postgres_data:
